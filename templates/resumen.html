{% extends "base.html" %} {% block title %} Resumen {% endblock %} {% block
content %}

<h2 class="text-center mb-4">Resumen por Día de Trabajo</h2>

<div class="table-responsive">
  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Día</th>
        <th>Cantidad de colaboradores</th>
      </tr>
    </thead>

    <tbody>
      {% for dia, cantidad in resumen.items() %}

      <tr>
        <td>{{ dia }}</td>
        <td>{{ cantidad }}</td>
      </tr>

      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
