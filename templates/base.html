<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Registro de Colaboradores{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS propio -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='estilos.css') }}"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('registro') }}">
          Registro de Colaboradores
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('registro') }}"> Registro </a>

            <a class="nav-link" href="{{ url_for('colaboradores') }}">
              Colaboradores
            </a>

            <a class="nav-link" href="{{ url_for('resumen') }}"> Resumen </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO DE CADA PÁGINA -->
    <main class="container my-5">{% block content %} {% endblock %}</main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">Desarrollo Web 036 - Universidad Mariano Gálvez</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
