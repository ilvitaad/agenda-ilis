{% extends "base.html" %} {% block title %}Registro de Colaboradores{% endblock
%} {% block content %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow">
      <div class="card-body p-4">
        <h2 class="text-center mb-4">
          Bienvenido al Registro de Colaboradores!
        </h2>

        <p class="text-center text-muted">
          Ingresa los datos del colaborador y su día de turno.
        </p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('registro') }}">
          <!-- Nombre -->
          <div class="mb-3">
            <label for="nombre" class="form-label"> Nombre </label>

            <input
              type="text"
              class="form-control"
              id="nombre"
              name="nombre"
              required
            />
          </div>

          <!-- Apellido -->
          <div class="mb-3">
            <label for="apellido" class="form-label"> Apellido </label>

            <input
              type="text"
              class="form-control"
              id="apellido"
              name="apellido"
              required
            />
          </div>

          <!-- Fecha de nacimiento -->
          <div class="mb-3">
            <label for="fecha_nacimiento" class="form-label">
              Fecha de nacimiento
            </label>

            <input
              type="date"
              class="form-control"
              id="fecha_nacimiento"
              name="fecha_nacimiento"
              required
            />
          </div>

          <!-- Día de trabajo -->
          <div class="mb-4">
            <label for="dia" class="form-label">
              Día de la semana que labora
            </label>

            <select class="form-select" id="dia" name="dia" required>
              <option value="" selected disabled>Seleccione un día</option>

              {% for dia in dias %}
              <option value="{{ dia }}">{{ dia }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Botón -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Guardar colaborador
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
